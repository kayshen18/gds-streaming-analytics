name: gds-bigdata

x-hadoop-common: &hadoop-common
  image: apache/hadoop:3.5.0
  user: "0:0"
  environment:
    HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
  volumes:
    - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  restart: unless-stopped
  networks:
    - gds-streaming-network

services:
  spark-ivy-init-permissions:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: gds-spark-ivy-init-permissions
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /opt/spark/.ivy2/cache /opt/spark/.ivy2/jars && chown -R 185:185 /opt/spark/.ivy2"]
    volumes:
      - spark-ivy-cache:/opt/spark/.ivy2
    networks:
      - gds-streaming-network
    restart: "no"

  hdfs-namenode-init:
    <<: *hadoop-common
    container_name: gds-hdfs-namenode-init
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [[ -f /data/dfs/name/current/VERSION ]]; then
          echo 'NameNode metadata already initialized; preserving existing data';
        else
          echo 'Formatting NameNode metadata for first use';
          hdfs namenode -format -nonInteractive gds-streaming-analytics;
        fi
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/data/dfs/name
    healthcheck:
      disable: true
    mem_limit: 768m
    cpus: 0.5

  hdfs-namenode:
    <<: *hadoop-common
    container_name: gds-hdfs-namenode
    hostname: hdfs-namenode
    command: ["hdfs", "namenode"]
    depends_on:
      hdfs-namenode-init:
        condition: service_completed_successfully
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      ENSURE_NAMENODE_DIR: /data/dfs/name
    ports:
      - "9870:9870"
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/data/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    mem_limit: 1536m
    cpus: 1.0

  hdfs-datanode:
    <<: *hadoop-common
    container_name: gds-hdfs-datanode
    hostname: hdfs-datanode
    command: ["hdfs", "datanode"]
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode-data:/data/dfs/data
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)'"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    mem_limit: 1536m
    cpus: 1.0

  spark-master:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: gds-spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_CONF_DIR: /opt/spark-conf
    depends_on:
      spark-ivy-init-permissions:
        condition: service_completed_successfully
      hdfs-namenode:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../../:/opt/gds-app:ro
      - ./hadoop:/opt/hadoop-conf:ro
      - ./spark:/opt/spark-conf:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    networks:
      - gds-streaming-network

  spark-worker:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: gds-spark-worker
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_CONF_DIR: /opt/spark-conf
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4g
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ../../:/opt/gds-app:ro
      - ./hadoop:/opt/hadoop-conf:ro
      - ./spark:/opt/spark-conf:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -q Worker"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 5g
    cpus: 2.0
    restart: unless-stopped
    networks:
      - gds-streaming-network

  spark-submit:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: gds-spark-submit
    hostname: spark-submit
    entrypoint: ["/bin/bash", "-c"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_CONF_DIR: /opt/spark-conf
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    volumes:
      - ../../:/opt/gds-app:ro
      - ./hadoop:/opt/hadoop-conf:ro
      - ./spark:/opt/spark-conf:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    networks:
      - gds-streaming-network

volumes:
  hdfs-namenode-data:
    name: gds-hdfs-namenode-data
  hdfs-datanode-data:
    name: gds-hdfs-datanode-data
  spark-ivy-cache:
    name: gds-spark-ivy-cache

networks:
  gds-streaming-network:
    name: gds-streaming-network
    external: true
