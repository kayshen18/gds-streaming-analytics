[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gds-streaming-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["confluent-kafka==2.15.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
spark = ["pyspark==4.1.3"]
mysql = ["mysql-connector-python==9.7.0"]
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "httpx2==2.10.0",
]

[project.scripts]
gds-profile = "gds_pipeline.cli:main"
gds-kafka = "gds_pipeline.kafka_cli:main"
gds-spark = "gds_pipeline.spark_cli:main"
gds-mysql = "gds_pipeline.mysql_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires an explicitly enabled local Kafka broker",
    "spark_hdfs_integration: requires explicitly enabled Docker Spark and HDFS",
    "spark_pipeline_integration: requires explicitly enabled Kafka, Spark, and HDFS",
    "mysql_integration: requires explicitly enabled Docker MySQL",
]
