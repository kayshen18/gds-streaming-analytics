[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gds-streaming-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["confluent-kafka==2.15.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
gds-profile = "gds_pipeline.cli:main"
gds-kafka = "gds_pipeline.kafka_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires an explicitly enabled local Kafka broker",
]
